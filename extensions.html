<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Report System - Extensions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">📋 Operational Dashboard</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="new_task.html">+ New Task</a></li>
                    <li class="nav-item"><a class="nav-link" href="view_tasks.html">View Tasks</a></li>
                    <li class="nav-item"><a class="nav-link active" href="extensions.html">Extensions</a></li>
                    <li class="nav-item"><a class="nav-link" href="dept.html">Departments</a></li>
                    <li class="nav-item"><a class="nav-link" href="backup.html">⚙️ Settings & Sync</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-4" style="max-width: 600px;">
        <div class="card shadow-sm p-4 mb-4">
            <h4>📞 Manage System Extensions</h4>
            <form id="extForm" class="input-group my-3">
                <input type="text" id="newExt" class="form-control" placeholder="e.g. 101, 102" required>
                <button type="submit" class="btn btn-primary">Add Extension</button>
            </form>
            <ul class="list-group list-group-flush shadow-sm rounded border mt-3" id="extListContainer"></ul>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        App.guard();
        function renderExts() {
            const container = document.getElementById('extListContainer');
            container.innerHTML = '';
            App.getExtensions().forEach((ext, idx) => {
                let li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center fw-bold';
                li.innerHTML = `<span>Extension: ${ext}</span><button class="btn btn-sm btn-outline-danger" onclick="removeExt(${idx})">Remove</button>`;
                container.appendChild(li);
            });
        }
        document.getElementById('extForm').addEventListener('submit', function(e){
            e.preventDefault();
            App.addExtension(document.getElementById('newExt').value.trim());
            document.getElementById('newExt').value = '';
            renderExts();
        });
        function removeExt(idx) {
            if(confirm('Remove this line mapping?')) { App.deleteExtension(idx); renderExts(); }
        }
        renderExts();
    </script>
</body>
</html>
