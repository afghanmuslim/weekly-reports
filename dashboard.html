<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Report System - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">📊 Operational Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="new_task.html">+ New Task</a></li>
                    <li class="nav-item"><a class="nav-link" href="view_tasks.html">View Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="extensions.html">Extensions</a></li>
                    <li class="nav-item"><a class="nav-link" href="dept.html">Departments</a></li>
                    <li class="nav-item"><a class="nav-link" href="backup.html">⚙️ Settings & Sync</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="App.logout()">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-4">
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-primary shadow-sm h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Tasks</h5>
                        <p class="display-4 fw-bold" id="totalTasksCount">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success shadow-sm h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Configured Departments</h5>
                        <p class="display-4 fw-bold" id="totalDeptsCount">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-info shadow-sm h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Active Extensions</h5>
                        <p class="display-4 fw-bold" id="totalExtsCount">0</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">🏢 Department Overview</div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="dashboardDeptList"></ul>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">📞 Extension Directory</div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="dashboardExtList"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        App.guard();
        document.getElementById('totalTasksCount').textContent = App.getTasks().length;
        document.getElementById('totalDeptsCount').textContent = App.getDepts().length;
        document.getElementById('totalExtsCount').textContent = App.getExtensions().length;
        
        const deptList = document.getElementById('dashboardDeptList');
        App.getDepts().forEach(d => {
            let li = document.createElement('li');
            li.className = 'list-group-item';
            li.textContent = d;
            deptList.appendChild(li);
        });
        
        const extList = document.getElementById('dashboardExtList');
        App.getExtensions().forEach(e => {
            let li = document.createElement('li');
            li.className = 'list-group-item';
            li.textContent = `Extension: ${e}`;
            extList.appendChild(li);
        });
    </script>
</body>
</html>
