<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Report System - New Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">📋 Operational Dashboard</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="new_task.html">+ New Task</a></li>
                    <li class="nav-item"><a class="nav-link" href="view_tasks.html">View Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="extensions.html">Extensions</a></li>
                    <li class="nav-item"><a class="nav-link" href="dept.html">Departments</a></li>
                    <li class="nav-item"><a class="nav-link" href="backup.html">⚙️ Settings & Sync</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-4" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h4 class="mb-4 text-center">📝 Record New Daily Task</h4>
            <form id="taskForm">
                <div class="mb-3 row">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">NO</label>
                        <input type="text" id="taskNo" class="form-control bg-secondary-subtle" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Date</label>
                        <input type="date" id="taskDate" class="form-control" required readonly>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Extension NO</label>
                    <select id="taskExt" class="form-select" required></select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Department</label>
                    <select id="taskDept" class="form-select" required></select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Task Description</label>
                    <textarea id="taskDesc" class="form-control" rows="4" required placeholder="Type task workflow details here..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label d-block fw-bold">Status</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="taskStatus" id="statusResolved" value="resolved" checked>
                        <label class="form-check-label text-success fw-bold" for="statusResolved">Resolved</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="taskStatus" id="statusSolved" value="solved">
                        <label class="form-check-label text-primary fw-bold" for="statusSolved">Solved</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Save Operational Task</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        App.guard();
        document.getElementById('taskNo').value = App.getNextTaskNo();
        document.getElementById('taskDate').value = new Date().toISOString().split('T')[0];
        
        const extSelect = document.getElementById('taskExt');
        App.getExtensions().forEach(e => {
            let opt = document.createElement('option');
            opt.value = e; opt.textContent = e; extSelect.appendChild(opt);
        });
        
        const deptSelect = document.getElementById('taskDept');
        App.getDepts().forEach(d => {
            let opt = document.createElement('option');
            opt.value = d; opt.textContent = d; deptSelect.appendChild(opt);
        });

        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const status = document.querySelector('input[name="taskStatus"]:checked').value;
            App.addTask({
                no: parseInt(document.getElementById('taskNo').value),
                ext: document.getElementById('taskExt').value,
                date: document.getElementById('taskDate').value,
                desc: document.getElementById('taskDesc').value,
                dept: document.getElementById('taskDept').value,
                status: status
            });
            alert('Task successfully logged!');
            window.location.href = 'view_tasks.html';
        });
    </script>
</body>
</html>
