<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Report System - Tasks Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark d-print-none">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">📋 Operational Dashboard</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="new_task.html">+ New Task</a></li>
                    <li class="nav-item"><a class="nav-link active" href="view_tasks.html">View Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="extensions.html">Extensions</a></li>
                    <li class="nav-item"><a class="nav-link" href="dept.html">Departments</a></li>
                    <li class="nav-item"><a class="nav-link" href="backup.html">⚙️ Settings & Sync</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4 d-print-none">
            <h4>📁 Operational Task Registries</h4>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-primary active" id="btnDaily" onclick="filterTasks('daily')">Daily Tasks</button>
                <button type="button" class="btn btn-outline-primary" id="btnWeekly" onclick="filterTasks('weekly')">Weekly Tasks</button>
                <button type="button" class="btn btn-outline-primary" id="btnMonthly" onclick="filterTasks('monthly')">Monthly Tasks</button>
            </div>
        </div>
        <div class="card shadow-sm p-3 mb-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle" id="taskTable">
                    <thead class="table-dark">
                        <tr>
                            <th>NO</th>
                            <th>Date</th>
                            <th>Extension</th>
                            <th>Department</th>
                            <th>Task Work Description</th>
                            <th>Status</th>
                            <th class="d-print-none">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>
            <div class="text-end mt-3 d-print-none">
                <button class="btn btn-primary px-4 py-2 fw-bold" onclick="printReport()">🖨️ Print Report Scope</button>
            </div>
        </div>
    </div>
    
    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form id="editForm" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">✏️ Edit Registry Entry</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editIndex">
            <div class="mb-3"><label class="form-label fw-bold">NO</label><input type="text" id="editNo" class="form-control" readonly></div>
            <div class="mb-3"><label class="form-label fw-bold">Date</label><input type="date" id="editDate" class="form-control" required></div>
            <div class="mb-3"><label class="form-label fw-bold">Extension NO</label><select id="editExt" class="form-select" required></select></div>
            <div class="mb-3"><label class="form-label fw-bold">Department</label><select id="editDept" class="form-select" required></select></div>
            <div class="mb-3"><label class="form-label fw-bold">Task</label><textarea id="editDesc" class="form-control" rows="3" required></textarea></div>
            <div class="mb-3">
                <label class="form-label fw-bold d-block">Status</label>
                <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="editStatus" id="editResolved" value="resolved"><label class="form-check-label text-success fw-bold" for="editResolved">Resolved</label></div>
                <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="editStatus" id="editSolved" value="solved"><label class="form-check-label text-primary fw-bold" for="editSolved">Solved</label></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-success">Save Operational Changes</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        App.guard();
        let currentFilter = 'daily';
        let modalObj = new bootstrap.Modal(document.getElementById('editModal'));

        function filterTasks(scope) {
            currentFilter = scope;
            document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
            if(scope==='daily') document.getElementById('btnDaily').classList.add('active');
            if(scope==='weekly') document.getElementById('btnWeekly').classList.add('active');
            if(scope==='monthly') document.getElementById('btnMonthly').classList.add('active');
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('taskTableBody');
            tbody.innerHTML = '';
            const tasks = App.getTasks();
            const now = new Date();
            
            tasks.forEach((task, index) => {
                const tDate = new Date(task.date);
                const diffTime = Math.abs(now - tDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (currentFilter === 'daily' && task.date !== now.toISOString().split('T')[0]) return;
                if (currentFilter === 'weekly' && diffDays > 7) return;
                if (currentFilter === 'monthly' && diffDays > 30) return;
                
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${task.no}</td>
                    <td>${task.date}</td>
                    <td>${task.ext}</td>
                    <td>${task.dept}</td>
                    <td>${task.desc}</td>
                    <td><span class="badge ${task.status === 'resolved' ? 'bg-success' : 'bg-primary'}">${task.status.toUpperCase()}</span></td>
                    <td class="d-print-none text-nowrap">
                        <button class="btn btn-sm btn-warning me-1" onclick="openEdit(${index})">Edit</button>
                        <button class="btn btn-sm btn-danger me-1" onclick="deleteTask(${index})">Delete</button>
                        <button class="btn btn-sm btn-info text-white" onclick="printRow(${index})">Print</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openEdit(index) {
            const task = App.getTasks()[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editNo').value = task.no;
            document.getElementById('editDate').value = task.date;
            document.getElementById('editDesc').value = task.desc;
            
            const extSel = document.getElementById('editExt'); extSel.innerHTML = '';
            App.getExtensions().forEach(e => { let o = document.createElement('option'); o.value=e; o.textContent=e; if(e===task.ext)o.selected=True; extSel.appendChild(o);});
            
            const deptSel = document.getElementById('editDept'); deptSel.innerHTML = '';
            App.getDepts().forEach(d => { let o = document.createElement('option'); o.value=d; o.textContent=d; if(d===task.dept)o.selected=True; deptSel.appendChild(o);});
            
            if(task.status === 'resolved') document.getElementById('editResolved').checked = true;
            else document.getElementById('editSolved').checked = true;
            
            modalObj.show();
        }

        document.getElementById('editForm').addEventListener('submit', function(e){
            e.preventDefault();
            const index = document.getElementById('editIndex').value;
            const status = document.querySelector('input[name="editStatus"]:checked').value;
            App.updateTask(index, {
                no: parseInt(document.getElementById('editNo').value),
                date: document.getElementById('editDate').value,
                ext: document.getElementById('editExt').value,
                dept: document.getElementById('editDept').value,
                desc: document.getElementById('editDesc').value,
                status: status
            });
            modalObj.hide();
            renderTable();
        });

        function deleteTask(index) {
            if(confirm('Are you sure you want to delete this operational entry?')) {
                App.deleteTask(index);
                renderTable();
            }
        }

        function printRow(index) {
            const originalBody = document.body.innerHTML;
            const task = App.getTasks()[index];
            document.body.innerHTML = `
                <div class="p-5">
                    <h2>📋 Single Operational Task Voucher</h2>
                    <hr>
                    <p><strong>Task Number:</strong> ${task.no}</p>
                    <p><strong>Log Date:</strong> ${task.date}</p>
                    <p><strong>Extension Mapping:</strong> ${task.ext}</p>
                    <p><strong>Department Unit:</strong> ${task.dept}</p>
                    <p><strong>Operational Summary:</strong> ${task.desc}</p>
                    <p><strong>Resolution Status:</strong> ${task.status.toUpperCase()}</p>
                </div>
            `;
            window.print();
            window.location.reload();
        }

        function printReport() {
            window.print();
        }

        renderTable();
    </script>
</body>
</html>
